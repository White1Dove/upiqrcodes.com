<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page Not Found - UPI QR Codes</title>
  <meta name="description" content="The requested page was not found on UPI QR Codes.">
  <meta name="robots" content="noindex,follow">
  <meta name="theme-color" content="#0b7a5a">
  <link rel="icon" type="image/png" href="/assets/brand/upi-qr-codes-icon.png">
  <link rel="apple-touch-icon" href="/assets/brand/upi-qr-codes-icon.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #17212f;
      --muted: #5c6675;
      --line: #dde4ee;
      --accent: #0b7a5a;
      --accent-dark: #075f47;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      color: var(--ink);
      background: #f8fafc;
      line-height: 1.6;
    }

    main {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }

    .not-found {
      width: min(680px, 100%);
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      padding: 28px;
      box-shadow: 0 18px 45px rgba(23, 33, 47, 0.1);
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      color: #000;
      font-weight: 800;
      text-decoration: none;
    }

    .brand img {
      width: 42px;
      height: auto;
      display: block;
    }

    h1 {
      margin: 22px 0 10px;
      font-size: clamp(32px, 7vw, 52px);
      line-height: 1.05;
    }

    p {
      margin: 0 0 16px;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 22px;
    }

    .button {
      border: 1px solid transparent;
      border-radius: 7px;
      min-height: 42px;
      padding: 10px 14px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      text-decoration: none;
    }

    .primary {
      background: var(--accent);
      color: #fff;
    }

    .primary:hover {
      background: var(--accent-dark);
    }

    .secondary {
      border-color: #cfd8e3;
      color: var(--ink);
      background: #fff;
    }

    .secondary:hover {
      border-color: var(--accent);
      color: var(--accent);
    }
  </style>
</head>
<body>
  <main>
    <section class="not-found" aria-labelledby="notFoundTitle">
      <a class="brand" href="/"><img src="/assets/brand/upi-qr-codes-icon.png" alt="UPI QR Codes logo"><span>UPI QR Codes</span></a>
      <h1 id="notFoundTitle">Page not found</h1>
      <p>The URL does not match an existing page on this site. Use the generator or browse the UPI QR guides instead.</p>
      <div class="actions">
        <a class="button primary" href="/">Open UPI QR Code Generator</a>
        <a class="button secondary" href="/blog/">Browse Blog</a>
      </div>
    </section>
  </main>
</body>
</html>
